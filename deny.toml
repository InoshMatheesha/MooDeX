# deny.toml - cargo-deny: licenses, advisories, bans, sources (spec 13.4).

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }, { triple = "x86_64-pc-windows-gnu" }]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. MPL-2.0 is file-level weak copyleft, pulled in unmodified by Tauri's HTML tooling.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The C/C++ OpenSSL stack is not wanted; TLS is rustls.
deny = [{ name = "openssl-sys" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
